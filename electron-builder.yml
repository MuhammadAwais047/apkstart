appId: com.apkstart.win
productName: ApkStart
copyright: Copyright © 2026 ApkStart

directories:
  output: dist/release
  buildResources: build

# Ship only runtime-required files; the source dir goes in whole (no asar: the window agent needs a real .ps1 path)
asar: false
files:
  - src/**/*
  - package.json
  - LICENSE
  - "!**/*.map"
  - "!**/node_modules/**"
  # For extracting .xz images at runtime (NAPI prebuilt, no ABI issues)
  - "node_modules/@napi-rs/lzma/**"
  - "node_modules/@napi-rs/lzma-win32-x64-msvc/**"
  - "!node_modules/@napi-rs/lzma/*.md"
  - "!node_modules/@napi-rs/lzma/*.ts"
  - "!node_modules/@napi-rs/lzma/browser-entry.*"

# Keep only English and Chinese UI locales (Electron locales drop from 41MB to ~3MB)
electronLanguages:
  - zh-CN
  - zh-TW
  - en-US

# Full runtime (emulator + platform-tools + system images), produced by build/prepare-runtime.js.
# Once packed, the first start needs no downloads.
extraResources:
  - from: build/runtime
    to: runtime
    filter:
      - "**/*"
      - "!.prepared"

win:
  target:
    - target: nsis
      arch:
        - x64
  icon: src/ui/assets/appicon.ico
  # Install into the current user dir; no system drive writes and no admin rights
  requestedExecutionLevel: asInvoker

nsis:
  # No longer "one click into the default C: dir": a standard wizard lets the user pick a location
  # (a non-system drive relieves C:; runtime data dirs are configured separately in settings).
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  displayLanguageSelector: false
  # always: recreate the desktop .lnk even if one with that name exists.
  # The default true only creates it when absent; on some machines (security software blocking, desktop
  # redirected by OneDrive, a stale shortcut pointing at a deleted dir) install ends with no icon,
  # or an icon still pointing at the old exe. always guarantees the current install dir after every install.
  createDesktopShortcut: always
  createStartMenuShortcut: true
  artifactName: ApkStart-${version}-Setup.exe
  # Stop the running runtime processes before uninstall so file locks do not block deletion
  # (when Huorong-style shredders cannot delete, qemu/adb processes are usually still resident).
  include: build/installer.nsh
  # The installer already contains the full runtime (emulator + system images .gz); the first start after
  # install expands the images into the user dir and nothing is downloaded again.

# Compression level: normal (zlib). Images are already xz/gz; NSIS only compresses Electron dlls,
# normal vs maximum is nearly the same size, but maximum (LZMA) adds tens of minutes to packaging.
# Note: when CI runs npx from PowerShell, an inline -c.compression=xxx gets split and treated as a
# config path, so the level is set only here, never overridden inline in the workflow.
compression: normal
