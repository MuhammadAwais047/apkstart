name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build portable edition and publish
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies (including the Electron runtime)
        run: npm ci
        env:
          ELECTRON_MIRROR: https://npmmirror.com/mirrors/electron/

      - name: Run tests
        run: npm test

      - name: Pack the portable edition
        run: npm run pack

      # Use 7-Zip instead of Compress-Archive: same directory, .NET deflate makes 105MB,
      # 7-Zip -mx=9 makes 99.6MB - those 5MB decide whether Gitee gets "one directly extractable
      # zip" or "two parts that must be joined by hand". build/zip.js also has a size gate: over
      # 100MiB fails the job outright, so we do not quietly regress to part packages later.
      - name: Compress the artifact (7-Zip, 100MiB size gate)
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          if (-not $tag.StartsWith('v')) { $tag = "v$tag" }
          node build/zip.js dist/ApkStart-win64-portable "ApkStart-$tag-win64-portable.zip" --limit-mb 100
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-Item "ApkStart-$tag-win64-portable.zip" | Select-Object Name, Length

      # Create the Release and upload the light portable build (tiny shell; runtime downloads on first start)
      - name: Create the Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          if (-not $tag.StartsWith('v')) { $tag = "v$tag" }
          $zip = "ApkStart-$tag-win64-portable.zip"
          # Idempotent: if the release exists (re-run / re-pushed tag) skip create and only upload assets
          $existing = gh release view $tag --json tagName -q .tagName 2>$null
          # Use a hand-written note when present (.github/release-notes-<tag>.md); it beats
          # the generated "Full Changelog"; fall back to auto-generation only when absent.
          $notes = ".github/release-notes-$tag.md"
          if (-not $existing) {
            if (Test-Path $notes) {
              gh release create $tag --title "ApkStart $tag" --notes-file $notes
            } else {
              gh release create $tag --title "ApkStart $tag" --generate-notes
            }
            if ($LASTEXITCODE -ne 0) { exit 1 }
          }
          $ok = $false
          for ($i = 1; $i -le 3 -and -not $ok; $i++) {
            gh release upload $tag $zip --clobber
            if ($LASTEXITCODE -eq 0) { $ok = $true } else { Start-Sleep -Seconds 15 }
          }
          if (-not $ok) { Write-Error "Upload failed: $zip"; exit 1 }
          gh release view $tag --json assets --jq '.assets[].name'

      # Sync to Gitee: direct GitHub from mainland China runs at tens of KB/s, Gitee usually several MB/s.
      # The packed portable is ~99.6MB, within the Gitee 100MB per-file cap, so one whole package
      # is uploaded and users can extract it directly; only over-cap packages fall back to .part1/.part2 in publish-gitee.js.
      # Setup (1.4GB) and the runtime bundle (1.4GB) are far over the cap and stay on GitHub -
      # the app unions "which source has assets", so updates are unaffected.
      # Gitee sync warns but does not block on missing token / network: otherwise the build job goes red
      # and the full job behind needs: build is skipped entirely, so even GitHub Setup / runtime never ship.
      # A missing token still shows red in the log (continue-on-error is "visible but non-fatal"), never silent.
      - name: Sync the portable edition to Gitee
        continue-on-error: true
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
        shell: pwsh
        run: |
          # Previously this step "silently skipped without a token and still showed success" -
          # that is how v0.3.4 quietly lost a Gitee release until someone noticed.
          # Now a missing token fails the step; red once beats silent again.
          if (-not $env:GITEE_TOKEN) {
            Write-Error "GITEE_TOKEN is missing: no installer will be published to Gitee for this release. Add GITEE_TOKEN under Settings → Secrets and variables → Actions (a token with releases permission is enough)."
            exit 1
          }
          $tag = "${{ github.ref_name }}"
          if (-not $tag.StartsWith('v')) { $tag = "v$tag" }
          # Same notes as GitHub; do not leave Gitee with only "portable package"
          $notes = ".github/release-notes-$tag.md"
          if (Test-Path $notes) {
            node tools/publish-gitee.js $tag --zip "ApkStart-$tag-win64-portable.zip" --notes $notes
          } else {
            node tools/publish-gitee.js $tag --zip "ApkStart-$tag-win64-portable.zip"
          }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  full:
    name: Build the full edition (bundled runtime, offline out of the box)
    runs-on: windows-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci
        env:
          ELECTRON_MIRROR: https://npmmirror.com/mirrors/electron/

      # Assemble the runtime from official Google sources (emulator + platform-tools + aehd + Play x86_64 image).
      # Output goes to engine/, matching the local dev layout.
      - name: Assemble the runtime
        run: node build/fetch-runtime.js engine

      # prepare-runtime compresses system.img/vendor.img to xz (LZMA2).
      # CI runners have 2 cores: XZ_PRESET=6 cuts compression from ~2h to ~40min (+3% size).
      # XZ_TIMEOUT_MS is a watchdog: on timeout kill and fall back to gzip,
      # never replaying "stdin no EOF -> 0-byte output -> 3-hour hang".
      - name: Prepare the runtime (xz compression, reduced preset in CI)
        run: node build/prepare-runtime.js --force
        env:
          XZ_PRESET: '6'
          XZ_TIMEOUT_MS: '3600000'

      # Bundle the Microsoft VC++ 2015-2022 x64 runtime: the Android emulator (Qt6) and qemu need it;
      # without it the app fails to start on "other PCs" (0xc0000135 / missing MSVCP140).
      # Placed in build/runtime, shipped with extraResources; one-click install works offline too.
      - name: Download the VC++ runtime (bundled offline)
        shell: pwsh
        run: |
          $dir = "build\runtime"
          if (-not (Test-Path $dir)) { New-Item -ItemType Directory -Force -Path $dir | Out-Null }
          $out = "$dir\vc_redist.x64.exe"
          Write-Output "Downloading the VC++ 2015-2022 x64 runtime…"
          curl.exe -L -o $out "https://aka.ms/vs/17/release/vc_redist.x64.exe"
          if (-not (Test-Path $out) -or (Get-Item $out).Length -lt 1MB) { Write-Error "vc_redist download failed" }
          Get-Item $out | Select-Object Name, Length

      # Without a git tag electron-builder does not publish implicitly; with a tag it also fails with
      # "GitHub Personal Access Token is not set" and exits 1 because this job has no GH_TOKEN (the old root cause).
      # So pass --publish never explicitly; the later "upload full build to Release" step uses gh release upload.
      - name: Build the full-edition installer
        run: npx electron-builder --win nsis --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Upload the full edition to the Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          if (-not $tag.StartsWith('v')) { $tag = "v$tag" }
          $setup = Get-ChildItem dist/release/*Setup.exe | Select-Object -First 1
          if (-not $setup) { Write-Error "Setup.exe not found"; exit 1 }
          Write-Output ("Uploading {0} ({1:N0} MB)" -f $setup.Name, ($setup.Length / 1MB))
          $ok = $false
          for ($i = 1; $i -le 3 -and -not $ok; $i++) {
            gh release upload $tag $setup.FullName --clobber
            if ($LASTEXITCODE -eq 0) { $ok = $true } else { Start-Sleep -Seconds 20 }
          }
          if (-not $ok) { Write-Error "Upload failed: $($setup.Name)"; exit 1 }
          gh release view $tag --json assets --jq '.assets[] | "\(.name) \(.size)"'

      # The light build (no runtime) no longer downloads emulator / system images one by one from dl.google.com,
      # it fetches this single bundle - the same GitHub Release used by in-app updates,
      # so mainland stability and troubleshooting live in one place.
      # The content is already xz-compressed images; bsdtar zips directly (no second compression, saves tens of minutes).
      - name: Package the full runtime bundle (download source for the slim edition)
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          if (-not $tag.StartsWith('v')) { $tag = "v$tag" }
          $zip = "ApkStart-runtime-$tag.zip"
          if (-not (Test-Path "build\runtime\emulator\emulator.exe")) { Write-Error "build\runtime is incomplete"; exit 1 }
          tar.exe -a -cf $zip -C "build\runtime" .
          if ($LASTEXITCODE -ne 0) { Write-Error "Failed to package the runtime"; exit 1 }
          Get-Item $zip | Select-Object Name, @{n='MB';e={[math]::Round($_.Length/1MB,1)}}

      - name: Upload the runtime bundle to the Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          if (-not $tag.StartsWith('v')) { $tag = "v$tag" }
          $zip = "ApkStart-runtime-$tag.zip"
          $ok = $false
          for ($i = 1; $i -le 3 -and -not $ok; $i++) {
            gh release upload $tag $zip --clobber
            if ($LASTEXITCODE -eq 0) { $ok = $true } else { Start-Sleep -Seconds 20 }
          }
          if (-not $ok) { Write-Error "Upload failed: $zip"; exit 1 }
          gh release view $tag --json assets --jq '.assets[] | "\(.name) \(.size)"'
